[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disapptrks-analysis-dashboard"
version = "0.1.0"
description = "Streamlit dashboard for the Run 3 Disappearing Tracks analysis"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.35",
  "pandas>=2.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dashboard*"]
